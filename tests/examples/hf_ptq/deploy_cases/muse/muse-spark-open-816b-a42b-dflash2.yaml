# TP4/EP4 recipe: https://huggingface.co/nvidia/Muse-Spark-Open-816B-A42B-DFlash2
# Uses lmsysorg/sglang:dev-muse-spark-open or a build with equivalent Muse/DFlash2 support.
test_muse_spark_dflash2:
  - model_id: nvidia/Muse-Spark-Open-816B-A42B-DFlash2
    base_model: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
    tensor_parallel_size: 4
    mini_sm: 100
    require_speculation: true
    backends:
      sglang:
        engine_kwargs:
          quantization: modelopt_fp4
          moe_runner_backend: flashinfer_trtllm
          ep_size: 4
          attention_backend: trtllm_mha
          page_size: 128
          kv_cache_dtype: fp8_e4m3
          mem_fraction_static: 0.8
          reasoning_parser: muse
          tool_call_parser: muse
          enable_layernorm_sp: true
          enable_megamoe_for_layernorm_sp: true
          speculative_algorithm: DFLASH
          speculative_draft_attention_backend: fa4
          speculative_num_draft_tokens: 8
          # This functional check does not exercise the target's full context capacity.
          context_length: 8192
        sampling_kwargs:
          temperature: 0.0
          max_new_tokens: 128
